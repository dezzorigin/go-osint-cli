<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-label="Diagram alur go-osint-cli: input username, lima HTTP GET paralel ke GitHub, GitLab, Dev.to, Pinterest dan Reddit, lalu status dipetakan jadi hasil dan dicetak berurutan.">
  <style>
    .bg { fill:#0d1117; }
    .panel { fill:#161b22; stroke:#30363d; stroke-width:1; }
    .title { fill:#e6edf3; font:700 26px -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .sub { fill:#8b949e; font:400 15px -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .node-t { fill:#e6edf3; font:600 16px ui-monospace,Menlo,Consolas,monospace; }
    .node-s { fill:#8b949e; font:400 12.5px -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .chip-t { fill:#e6edf3; font:600 15px ui-monospace,Menlo,Consolas,monospace; }
    .chip-s { fill:#8b949e; font:400 11.5px ui-monospace,Menlo,Consolas,monospace; }
    .arrow { stroke:#58a6ff; stroke-width:2; fill:none; marker-end:url(#ah); }
    .arrow-dim { stroke:#30363d; stroke-width:2; fill:none; marker-end:url(#ah2); }
    .g { fill:#3fb950; } .r { fill:#f85149; } .y { fill:#d29922; }
    .leg { fill:#8b949e; font:400 13px -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .foot { fill:#6e7681; font:400 12px -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#58a6ff"/></marker>
    <marker id="ah2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#30363d"/></marker>
  </defs>

  <rect class="bg" width="920" height="560" rx="12"/>
  <text class="title" x="40" y="52">go-osint-cli — alur scan</text>
  <text class="sub" x="40" y="78">Satu username, lima platform, satu kali jalan. Paralel, tanpa login.</text>

  <!-- input -->
  <rect class="panel" x="40" y="110" width="220" height="76" rx="10"/>
  <text class="node-t" x="60" y="140">input username</text>
  <text class="node-s" x="60" y="164">argumen CLI / prompt</text>

  <!-- fan out -->
  <path class="arrow" d="M 260 148 H 300"/>
  <rect class="panel" x="300" y="110" width="220" height="76" rx="10"/>
  <text class="node-t" x="320" y="140">5× HTTP GET paralel</text>
  <text class="node-s" x="320" y="164">goroutine · timeout 10 dtk</text>

  <!-- platforms -->
  <g>
    <rect class="panel" x="580" y="96" width="300" height="34" rx="8"/><text class="chip-t" x="596" y="118">GitHub</text><text class="chip-s" x="700" y="118">github.com/&lt;user&gt;</text>
    <rect class="panel" x="580" y="140" width="300" height="34" rx="8"/><text class="chip-t" x="596" y="162">GitLab</text><text class="chip-s" x="700" y="162">gitlab.com/&lt;user&gt;</text>
    <rect class="panel" x="580" y="184" width="300" height="34" rx="8"/><text class="chip-t" x="596" y="206">Dev.to</text><text class="chip-s" x="700" y="206">dev.to/&lt;user&gt;</text>
    <rect class="panel" x="580" y="228" width="300" height="34" rx="8"/><text class="chip-t" x="596" y="250">Pinterest</text><text class="chip-s" x="700" y="250">pinterest.com/&lt;user&gt;/</text>
    <rect class="panel" x="580" y="272" width="300" height="34" rx="8"/><text class="chip-t" x="596" y="294">Reddit</text><text class="chip-s" x="700" y="294">reddit.com/user/&lt;user&gt;/</text>
  </g>
  <path class="arrow-dim" d="M 520 130 C 550 130, 550 113, 578 113"/>
  <path class="arrow-dim" d="M 520 148 C 545 148, 545 157, 578 157"/>
  <path class="arrow-dim" d="M 520 160 C 550 160, 550 201, 578 201"/>
  <path class="arrow-dim" d="M 520 168 C 545 168, 545 245, 578 245"/>
  <path class="arrow-dim" d="M 520 178 C 550 178, 550 289, 578 289"/>

  <!-- status mapping -->
  <path class="arrow" d="M 730 306 V 340"/>
  <rect class="panel" x="560" y="340" width="340" height="92" rx="10"/>
  <text class="node-t" x="580" y="370">status → teks hasil</text>
  <text class="node-s" x="580" y="392">formatResult() — fungsi murni, teruji</text>
  <text class="leg" x="580" y="416"><tspan class="g">●</tspan> 200 Found&#160;&#160;<tspan class="r">●</tspan> 404 Not Found&#160;&#160;<tspan class="y">●</tspan> 3xx Redirect</text>

  <!-- ordered output -->
  <path class="arrow" d="M 560 386 H 300"/>
  <rect class="panel" x="40" y="340" width="260" height="92" rx="10"/>
  <text class="node-t" x="60" y="370">cetak berurutan</text>
  <text class="node-s" x="60" y="392">urutan platform tetap,</text>
  <text class="node-s" x="60" y="410">bukan urutan selesai</text>

  <!-- duration -->
  <path class="arrow" d="M 170 432 V 470"/>
  <rect class="panel" x="40" y="470" width="320" height="52" rx="10"/>
  <text class="node-t" x="60" y="502">Scan completed in: ~3 dtk</text>

  <text class="foot" x="40" y="546">Tanpa redirect · User-Agent go-osint-cli · tanpa dependensi · go-osint-cli.pages.dev</text>
</svg>
